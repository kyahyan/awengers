<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FBX to Sprite Exporter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #fca311;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
        }

        .panel h2 {
            color: #5dade2;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        #preview-canvas {
            width: 512px;
            height: 512px;
            background: #0f0f23;
            border: 2px solid #333;
            border-radius: 8px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 14px;
            color: #aaa;
        }

        input,
        select,
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: #0f0f23;
            color: #fff;
            border: 1px solid #444;
        }

        button {
            background: #fca311;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #e09200;
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .cam-btn {
            background: #2d4a6e;
            color: #5dade2;
            padding: 8px 12px;
            font-size: 12px;
            border: 1px solid #5dade2;
        }

        .cam-btn:hover {
            background: #5dade2;
            color: #000;
        }

        .animation-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0f0f23;
            border-radius: 6px;
            padding: 10px;
        }

        .animation-item {
            padding: 8px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .animation-item:hover {
            background: #1a1a2e;
        }

        .animation-item.selected {
            background: #2d4a6e;
            color: #5dade2;
        }

        .log {
            background: #0a0a15;
            padding: 10px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #7f8c8d;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.success {
            color: #2ecc71;
        }

        .log-entry.error {
            color: #e74c3c;
        }

        .progress-bar {
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fca311, #e74c3c);
            width: 0%;
            transition: width 0.1s;
        }

        .sprite-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 300px;
            overflow-y: auto;
            background: #0a0a15;
            padding: 10px;
            border-radius: 6px;
        }

        .sprite-preview img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: #222;
            border: 1px solid #444;
        }
    </style>
</head>

<body>
    <h1>🎮 FBX to Sprite Exporter</h1>

    <div class="container">
        <!-- Left Panel: Preview -->
        <div class="panel">
            <h2>3D Preview</h2>
            <canvas id="preview-canvas" width="512" height="512"></canvas>
            <div class="controls">
                <label>Model Path (relative to public/) or upload FBX:</label>
                <input type="text" id="model-path"
                    value="assets/Characters/Heroes/Phoenix Knight/phoenix knight/phoenix knight with animation.fbx">
                <input type="file" id="model-file" accept=".fbx" style="margin-bottom: 10px;">

                <label>Diffuse Texture (Color):</label>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 5px;">
                    <input type="text" id="texture-path" style="flex: 1;"
                        value="assets/Characters/Heroes/Phoenix Knight/phoenix knight/FH_QS_color.png">
                    <input type="file" id="texture-file" accept="image/*" style="width: 120px;">
                </div>

                <label>Normal Map (optional):</label>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 5px;">
                    <input type="text" id="normal-map-path" style="flex: 1;"
                        value="assets/Characters/Heroes/Phoenix Knight/phoenix knight/FH_QS_normHeroNorRGB24.png">
                    <input type="file" id="normal-file" accept="image/*" style="width: 120px;">
                </div>

                <label>Additional Textures (Masks, Emission, etc.):</label>
                <input type="file" id="extra-textures" accept="image/*" multiple style="margin-bottom: 10px;">
                <div id="extra-texture-list" style="font-size: 12px; color: #888; margin-bottom: 10px;"></div>

                <button id="load-btn">Load Model</button>
            </div>
        </div>

        <!-- Right Panel: Export Controls -->
        <div class="panel">
            <h2>Animations</h2>
            <div class="animation-list" id="animation-list">
                <div style="color: #888;">Load a model to see animations...</div>
            </div>

            <h2 style="margin-top: 20px;">Export Settings</h2>
            <div class="controls">
                <label>Frame Size (px):</label>
                <input type="number" id="frame-size" value="512" min="64" max="2048" step="64">
                <label>Frames Per Second:</label>
                <input type="number" id="fps" value="24" min="1" max="60">
                <label>Background:</label>
                <select id="bg-color">
                    <option value="transparent">Transparent</option>
                    <option value="#00ff00">Green Screen</option>
                    <option value="#ff00ff">Magenta Screen</option>
                    <option value="#000000">Black</option>
                </select>
                <label>Brightness:</label>
                <input type="range" id="brightness" min="0.5" max="2" step="0.1" value="1.2">
                <label>Contrast:</label>
                <input type="range" id="contrast" min="0.5" max="2" step="0.1" value="1.0">
                <label>Saturation:</label>
                <input type="range" id="saturation" min="0.5" max="2" step="0.1" value="1.3">

                <div style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
                    <input type="checkbox" id="pingpong-loop" style="width: 18px; height: 18px;">
                    <label for="pingpong-loop" style="cursor: pointer;">Breathing Loop (Sine Wave)</label>
                </div>

                <label>Camera View:</label>
                <div class="camera-presets" style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="cam-btn" data-view="front">Front View</button>
                    <button type="button" class="cam-btn" data-view="isoleft">Iso Left (My Team)</button>
                    <button type="button" class="cam-btn" data-view="isoright">Iso Right (Enemy)</button>
                    <button type="button" class="cam-btn" data-view="myteam">Side Left</button>
                    <button type="button" class="cam-btn" data-view="enemy">Side Right</button>
                </div>
                <button id="export-btn" disabled>Export Selected Animation</button>
                <button id="export-all-btn" disabled>Export All (All Views × All Animations)</button>
            </div>

            <h2 style="margin-top: 20px;">Progress</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="log" id="log"></div>

            <h2 style="margin-top: 20px;">Sprite Preview</h2>
            <div class="sprite-preview" id="sprite-preview"></div>
        </div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <!-- JSZip for bundling exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // DOM Elements
        const canvas = document.getElementById('preview-canvas');
        const modelPathInput = document.getElementById('model-path');
        const modelFileInput = document.getElementById('model-file');
        const texturePathInput = document.getElementById('texture-path');
        const textureFileInput = document.getElementById('texture-file');
        const normalMapInput = document.getElementById('normal-map-path');
        const normalFileInput = document.getElementById('normal-file');
        const extraTexturesInput = document.getElementById('extra-textures');
        const extraTextureList = document.getElementById('extra-texture-list');
        const loadBtn = document.getElementById('load-btn');
        const animationListEl = document.getElementById('animation-list');

        // Track uploaded textures
        let uploadedTextures = {
            diffuse: null,
            normal: null,
            extras: []
        };

        // Show extra texture file names
        extraTexturesInput.addEventListener('change', () => {
            const files = Array.from(extraTexturesInput.files);
            extraTextureList.textContent = files.map(f => f.name).join(', ') || 'No files selected';
            uploadedTextures.extras = files;
        });

        // Handle file uploads
        let uploadedModelFile = null;

        modelFileInput.addEventListener('change', () => {
            if (modelFileInput.files[0]) {
                uploadedModelFile = modelFileInput.files[0];
                modelPathInput.value = modelFileInput.files[0].name;
                log(`Model file selected: ${modelFileInput.files[0].name}`);
            }
        });

        textureFileInput.addEventListener('change', () => {
            if (textureFileInput.files[0]) {
                uploadedTextures.diffuse = textureFileInput.files[0];
                texturePathInput.value = textureFileInput.files[0].name;
            }
        });

        normalFileInput.addEventListener('change', () => {
            if (normalFileInput.files[0]) {
                uploadedTextures.normal = normalFileInput.files[0];
                normalMapInput.value = normalFileInput.files[0].name;
            }
        });
        const exportBtn = document.getElementById('export-btn');
        const exportAllBtn = document.getElementById('export-all-btn');
        const frameSizeInput = document.getElementById('frame-size');
        const fpsInput = document.getElementById('fps');
        const bgColorSelect = document.getElementById('bg-color');
        const brightnessSlider = document.getElementById('brightness');
        const saturationSlider = document.getElementById('saturation');
        const progressEl = document.getElementById('progress');
        const logEl = document.getElementById('log');
        const spritePreviewEl = document.getElementById('sprite-preview');

        // Three.js Setup
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(512, 512);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 1.5, 4);

        const controls = new OrbitControls(camera, canvas);
        controls.target.set(0, 1, 0);
        controls.update();

        // Lighting - Brighter for sprite export
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Increased from 0.6
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5); // Increased from 1
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Fill light from front for better visibility
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
        fillLight.position.set(0, 5, 10);
        scene.add(fillLight);

        // Rim light from behind for depth
        const rimLight = new THREE.DirectionalLight(0xaaddff, 0.5);
        rimLight.position.set(0, 5, -10);
        scene.add(rimLight);

        // State
        let currentModel = null;
        let mixer = null;
        let animations = [];
        let selectedAnimationIndex = -1;
        let activeBreathingAction = null; // Track action for manual sine-wave control

        // Brightness slider updates lighting in real-time
        brightnessSlider.addEventListener('input', () => {
            const brightness = parseFloat(brightnessSlider.value);
            ambientLight.intensity = brightness;
            directionalLight.intensity = brightness * 1.2;
            fillLight.intensity = brightness * 0.6;
        });

        // Ping-pong checkbox updates animation loop mode in real-time
        document.getElementById('pingpong-loop').addEventListener('change', () => {
            if (selectedAnimationIndex >= 0) {
                playAnimation(selectedAnimationIndex);
            }
        });

        // Camera View Presets
        let modelHeight = 2; // Default, updated when model loads
        const cameraPresets = {
            front: () => {
                camera.position.set(0, modelHeight * 0.5, modelHeight * 2.5);
                camera.lookAt(0, modelHeight * 0.5, 0);
                controls.target.set(0, modelHeight * 0.5, 0);
            },
            isoleft: () => {
                // Iso Left (My Team) - View from Behind-Left (See the back of the unit like Player Team)
                // Positioned behind (-Z) and to the left (-X)
                camera.position.set(-modelHeight * 2, modelHeight * 1.5, -modelHeight * 2);
                camera.lookAt(0, modelHeight * 0.3, 0);
                controls.target.set(0, modelHeight * 0.3, 0);
            },
            isoright: () => {
                // Iso Right (Enemy) - View from Front-Right (See the front of the unit like Enemy Team)
                // Positioned in front (+Z) and to the right (+X)
                camera.position.set(modelHeight * 2, modelHeight * 1.5, modelHeight * 2);
                camera.lookAt(0, modelHeight * 0.3, 0);
                controls.target.set(0, modelHeight * 0.3, 0);
            },
            myteam: () => {
                // Side Left
                camera.position.set(-modelHeight * 2.5, modelHeight * 0.5, 0);
                camera.lookAt(0, modelHeight * 0.5, 0);
                controls.target.set(0, modelHeight * 0.5, 0);
            },
            enemy: () => {
                // Side Right
                camera.position.set(modelHeight * 2.5, modelHeight * 0.5, 0);
                camera.lookAt(0, modelHeight * 0.5, 0);
                controls.target.set(0, modelHeight * 0.5, 0);
            }
        };

        // Camera preset buttons
        document.querySelectorAll('.cam-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                if (cameraPresets[view]) {
                    cameraPresets[view]();
                    controls.update();
                    log(`Camera: ${btn.textContent}`);
                }
            });
        });

        // Logging
        function log(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (activeBreathingAction && mixer) {
                // Manual Sine-Wave "Breathing" for Preview
                const duration = activeBreathingAction.getClip().duration;
                // Full cycle = 2 * duration (In + Out)
                // Use Date.now() for continuous time
                const loopDuration = duration * 2;
                const time = (Date.now() / 1000) % loopDuration;
                const progress = time / loopDuration; // 0 -> 1

                // Sine Easing: 0.5 * (1 - cos(2*PI*p)) -> Goes 0 to 1 to 0 smoothly
                const easedProgress = 0.5 * (1 - Math.cos(2 * Math.PI * progress));

                activeBreathingAction.time = easedProgress * duration;
                mixer.update(0); // Update pose without advancing internal time
            } else if (mixer) {
                mixer.update(delta);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Load Model
        loadBtn.addEventListener('click', async () => {
            const modelPath = modelPathInput.value.trim();
            const texturePath = texturePathInput.value.trim();

            if (!modelPath) {
                log('Please enter a model path.', 'error');
                return;
            }

            log(`Loading model: ${modelPath}`);
            loadBtn.disabled = true;

            // Clear previous
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
                mixer = null;
                animations = [];
            }

            const loader = new FBXLoader();
            try {
                let object;

                // Load from uploaded file or from path
                if (uploadedModelFile) {
                    const url = URL.createObjectURL(uploadedModelFile);
                    object = await loader.loadAsync(url);
                    log('Model loaded from uploaded file!', 'success');
                } else {
                    // Encode path components for spaces and special chars
                    const encodedModelPath = '/' + modelPath.split('/').map(p => encodeURIComponent(p)).join('/');
                    log(`Loading from path: ${encodedModelPath}`);
                    object = await loader.loadAsync(encodedModelPath);
                }

                // Apply textures if provided
                if (texturePath || uploadedTextures.diffuse) {
                    const textureLoader = new THREE.TextureLoader();
                    let texture;

                    // Load diffuse texture - prefer uploaded file
                    if (uploadedTextures.diffuse) {
                        const url = URL.createObjectURL(uploadedTextures.diffuse);
                        texture = await textureLoader.loadAsync(url);
                        log('Diffuse texture loaded from file!', 'success');
                    } else {
                        const encodedTexturePath = '/' + texturePath.split('/').map(p => encodeURIComponent(p)).join('/');
                        texture = await textureLoader.loadAsync(encodedTexturePath);
                    }
                    texture.colorSpace = THREE.SRGBColorSpace;

                    // Load normal map if provided - prefer uploaded file
                    let normalMap = null;
                    const normalMapPath = normalMapInput.value.trim();
                    if (uploadedTextures.normal) {
                        try {
                            const url = URL.createObjectURL(uploadedTextures.normal);
                            normalMap = await textureLoader.loadAsync(url);
                            log('Normal map loaded from file!', 'success');
                        } catch (e) {
                            log('Failed to load normal map file', 'error');
                        }
                    } else if (normalMapPath) {
                        try {
                            const encodedNormalPath = '/' + normalMapPath.split('/').map(p => encodeURIComponent(p)).join('/');
                            normalMap = await textureLoader.loadAsync(encodedNormalPath);
                            log('Normal map loaded!', 'success');
                        } catch (e) {
                            log('Normal map not found, skipping...', 'error');
                        }
                    }
                    // Load additional textures (masks, emission, etc.)
                    let emissionMap = null;
                    let aoMap = null;
                    let metallicMap = null;

                    for (const file of uploadedTextures.extras) {
                        const url = URL.createObjectURL(file);
                        const extraTexture = await textureLoader.loadAsync(url);
                        const name = file.name.toLowerCase();

                        // Auto-detect texture type from filename
                        if (name.includes('emis') || name.includes('glow') || name.includes('light')) {
                            emissionMap = extraTexture;
                            log(`Emission map loaded: ${file.name}`, 'success');
                        } else if (name.includes('ao') || name.includes('occlusion')) {
                            aoMap = extraTexture;
                            log(`AO map loaded: ${file.name}`, 'success');
                        } else if (name.includes('metal') || name.includes('spec')) {
                            metallicMap = extraTexture;
                            log(`Metallic map loaded: ${file.name}`, 'success');
                        } else if (name.includes('mask')) {
                            // Treat mask textures as emission for visual effect
                            emissionMap = extraTexture;
                            log(`Mask texture loaded as emission: ${file.name}`, 'success');
                        } else {
                            log(`Additional texture loaded: ${file.name}`);
                        }
                    }

                    object.traverse(child => {
                        if (child.isMesh) {
                            const materialOptions = {
                                map: texture,
                                roughness: 0.5,
                                metalness: 0.1
                            };

                            if (normalMap) {
                                materialOptions.normalMap = normalMap;
                                materialOptions.normalScale = new THREE.Vector2(1, 1);
                            }

                            if (emissionMap) {
                                materialOptions.emissiveMap = emissionMap;
                                materialOptions.emissive = new THREE.Color(0xffffff);
                                materialOptions.emissiveIntensity = 0.5;
                            }

                            if (aoMap) {
                                materialOptions.aoMap = aoMap;
                                materialOptions.aoMapIntensity = 1.0;
                            }

                            if (metallicMap) {
                                materialOptions.metalnessMap = metallicMap;
                                materialOptions.metalness = 0.5;
                            }

                            child.material = new THREE.MeshStandardMaterial(materialOptions);
                        }
                    });
                }

                // Scale down if huge
                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 5) {
                    const scale = 3 / maxDim;
                    object.scale.setScalar(scale);
                }

                // Recalculate box after scaling
                const scaledBox = new THREE.Box3().setFromObject(object);
                const center = scaledBox.getCenter(new THREE.Vector3());
                const scaledSize = scaledBox.getSize(new THREE.Vector3());

                // Center horizontally and put feet at ground level
                object.position.x = -center.x;
                object.position.z = -center.z;
                object.position.y = -scaledBox.min.y; // Feet at y=0

                scene.add(object);
                currentModel = object;

                // Update camera to frame the model - use outer modelHeight variable
                modelHeight = scaledSize.y;
                camera.position.set(0, modelHeight * 0.5, modelHeight * 2.5);
                camera.lookAt(0, modelHeight * 0.5, 0);
                controls.target.set(0, modelHeight * 0.5, 0);
                controls.update();

                // Setup animations
                mixer = new THREE.AnimationMixer(object);
                animations = object.animations || [];

                log(`Model loaded! Found ${animations.length} animation(s).`, 'success');
                updateAnimationList();

                exportBtn.disabled = animations.length === 0;
                exportAllBtn.disabled = animations.length === 0;

            } catch (err) {
                console.error('Full error:', err);
                log(`Error loading model: ${err?.message || err || 'Unknown error'}`, 'error');
            }

            loadBtn.disabled = false;
        });

        // Update animation list UI
        function updateAnimationList() {
            animationListEl.innerHTML = '';
            if (animations.length === 0) {
                animationListEl.innerHTML = '<div style="color: #888;">No animations found.</div>';
                return;
            }

            animations.forEach((clip, index) => {
                const item = document.createElement('div');
                item.className = 'animation-item' + (index === selectedAnimationIndex ? ' selected' : '');
                item.textContent = `${clip.name} (${clip.duration.toFixed(2)}s)`;
                item.addEventListener('click', () => {
                    selectedAnimationIndex = index;
                    updateAnimationList();
                    playAnimation(index);
                });
                animationListEl.appendChild(item);
            });
        }

        // Play animation
        function playAnimation(index) {
            if (!mixer || index < 0 || index >= animations.length) return;
            mixer.stopAllAction();
            const action = mixer.clipAction(animations[index]);
            action.reset();

            // Auto-detect "Idle" and enable breathing loop for smoother idle animations
            const animName = animations[index].name.toLowerCase();
            const isIdle = animName.includes('idle');
            const pingPongCheckbox = document.getElementById('pingpong-loop');

            pingPongCheckbox.checked = isIdle;

            // Check if breathing loop is enabled
            const breathingEnabled = pingPongCheckbox.checked;

            if (breathingEnabled) {
                // For breathing, we handle time manually in animate()
                action.paused = true;
                activeBreathingAction = action;
                log(`Playing: ${animations[index].name} (Breathing Loop)`);
            } else {
                action.setLoop(THREE.LoopRepeat);
                action.paused = false;
                activeBreathingAction = null;
                action.play();
                log(`Playing: ${animations[index].name}`);
            }

            // Always play to ensure start (manual update will override if paused)
            action.play();
        }

        // Export single animation
        exportBtn.addEventListener('click', () => {
            if (selectedAnimationIndex < 0) {
                log('Please select an animation first.', 'error');
                return;
            }
            exportAnimation(selectedAnimationIndex);
        });

        // Export all animations from all camera views into a ZIP
        exportAllBtn.addEventListener('click', async () => {
            const viewNames = ['front', 'isoleft', 'isoright', 'myteam', 'enemy'];
            const viewLabels = {
                front: 'front-view',
                isoleft: 'iso-left',
                isoright: 'iso-right',
                myteam: 'side-left',
                enemy: 'side-right'
            };

            const totalExports = viewNames.length * animations.length;
            let completed = 0;

            // Create ZIP file
            const zip = new JSZip();
            const modelName = modelPathInput.value.split('/').pop().replace('.fbx', '').replace(/[^a-z0-9]/gi, '_');

            log(`Starting export: ${animations.length} animations × ${viewNames.length} views = ${totalExports} spritesheets`);
            log('Creating ZIP archive...');

            for (const viewName of viewNames) {
                // Create folder for this view
                const viewFolder = zip.folder(viewLabels[viewName]);

                // Set camera to this view
                cameraPresets[viewName]();
                controls.update();
                log(`Processing: ${viewLabels[viewName]}`);

                // Wait for camera to update
                await new Promise(r => setTimeout(r, 100));

                for (let i = 0; i < animations.length; i++) {
                    const imageData = await exportAnimationToData(i);
                    const animName = animations[i].name.replace(/[^a-z0-9]/gi, '_');
                    viewFolder.file(`${animName}_spritesheet.png`, imageData, { base64: true });

                    completed++;
                    progressEl.style.width = `${(completed / totalExports) * 100}%`;
                    log(`Exported: ${viewLabels[viewName]}/${animName}`);
                }
            }

            // Generate and download ZIP
            log('Generating ZIP file...');
            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${modelName}_spritesheets.zip`;
            link.click();

            log(`ZIP download complete! ${totalExports} spritesheets in ${modelName}_spritesheets.zip`, 'success');
        });

        // Export animation to sprites with 2x super-sampling for high-quality anti-aliased output
        async function exportAnimation(animIndex) {
            const clip = animations[animIndex];
            const frameSize = parseInt(frameSizeInput.value) || 512;
            const fps = parseInt(fpsInput.value) || 24;
            const bgColor = bgColorSelect.value;
            const contrast = document.getElementById('contrast').value;
            const breathingEnabled = document.getElementById('pingpong-loop').checked;

            const duration = clip.duration;
            const baseFrames = Math.floor(duration * fps); // Original frames
            const frameDuration = 1 / fps;

            // For Breathing Loop: We need 2x duration (In + Out)
            // Use same total frames as linear ping-pong would, but map them via Sine
            const totalFrameCount = breathingEnabled ? (baseFrames * 2) : Math.max(1, baseFrames);

            // Calculate grid dimensions for sprite sheet
            const columns = 5; // Fixed columns for consistent layout
            const rows = Math.ceil(totalFrameCount / columns);

            // 2x Super-sampling: render at double resolution for anti-aliasing
            const renderSize = frameSize * 2; // e.g., 1024 for 512 frame size

            log(`Exporting "${clip.name}": ${totalFrameCount} frames @ ${fps}fps${breathingEnabled ? ' (Breathing Sine)' : ''}`);
            log(`Grid: ${columns}x${rows}, Super-sampling: ${renderSize}px -> ${frameSize}px`);

            // Setup offscreen renderer with anti-aliasing enabled
            const offscreenRenderer = new THREE.WebGLRenderer({
                alpha: bgColor === 'transparent',
                preserveDrawingBuffer: true,
                antialias: true // Enable hardware anti-aliasing
            });
            offscreenRenderer.setSize(renderSize, renderSize); // Render at 2x resolution
            offscreenRenderer.outputColorSpace = THREE.SRGBColorSpace;
            offscreenRenderer.setPixelRatio(1);

            if (bgColor !== 'transparent') {
                offscreenRenderer.setClearColor(bgColor, 1);
            }

            // Stop all, start this
            mixer.stopAllAction();
            const action = mixer.clipAction(clip);
            action.reset();
            action.play();
            action.paused = true; // Manual stepping

            spritePreviewEl.innerHTML = '';
            const frames = [];

            // Store original camera aspect/size
            const originalAspect = camera.aspect;
            camera.aspect = 1; // Square for export
            camera.updateProjectionMatrix();

            // Capture frames
            for (let f = 0; f < totalFrameCount; f++) {
                let time;

                if (breathingEnabled) {
                    // Normalize progress 0 -> 1 over the full In-Out cycle
                    const progress = f / totalFrameCount;
                    // Sine Easing: 0 -> 1 -> 0
                    const eased = 0.5 * (1 - Math.cos(2 * Math.PI * progress));
                    time = eased * duration;
                } else {
                    // Standard linear loop
                    time = f * frameDuration;
                    if (time > duration) time = time % duration; // Wrap safety
                }

                action.time = time;
                mixer.update(0); // Force update pose

                // Render using the MAIN CAMERA at high resolution
                offscreenRenderer.render(scene, camera);
                const dataUrl = offscreenRenderer.domElement.toDataURL('image/png');
                frames.push(dataUrl);

                // Preview (using smaller size for UI)
                const img = document.createElement('img');
                img.src = dataUrl;
                img.style.filter = `contrast(${contrast}) saturate(${document.getElementById('saturation').value})`;
                spritePreviewEl.appendChild(img);

                // Progress
                progressEl.style.width = `${((f + 1) / totalFrameCount) * 100}%`;

                await new Promise(r => setTimeout(r, 10)); // Yield
            }

            // Restore camera
            camera.aspect = originalAspect;
            camera.updateProjectionMatrix();

            // Create Sprite Sheet with grid layout
            // Total dimensions based on frame count and grid
            const sheetWidth = frameSize * columns;
            const sheetHeight = frameSize * rows;

            const sheetCanvas = document.createElement('canvas');
            sheetCanvas.width = sheetWidth;
            sheetCanvas.height = sheetHeight;
            const ctx = sheetCanvas.getContext('2d');

            // Enable image smoothing for high-quality downscaling
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Apply Filters
            const satVal = document.getElementById('saturation').value;
            ctx.filter = `contrast(${contrast}) saturate(${satVal})`;

            log(`Creating sprite sheet: ${sheetWidth}x${sheetHeight}px`);

            for (let i = 0; i < frames.length; i++) {
                const img = new Image();
                img.src = frames[i];
                await new Promise(r => { img.onload = r; });

                // Calculate grid position
                const col = i % columns;
                const row = Math.floor(i / columns);
                const x = col * frameSize;
                const y = row * frameSize;

                // Draw high-res frame scaled down to target size (2x -> 1x super-sampling)
                ctx.drawImage(img, x, y, frameSize, frameSize);
            }

            // Download
            const link = document.createElement('a');
            link.download = `${clip.name.replace(/[^a-z0-9]/gi, '_')}_spritesheet.png`;
            link.href = sheetCanvas.toDataURL('image/png');
            link.click();

            log(`Exported: ${link.download} (${sheetWidth}x${sheetHeight}px, ${totalFrameCount} frames${pingPongEnabled ? ', ping-pong' : ''})`, 'success');
            offscreenRenderer.dispose();
        }
